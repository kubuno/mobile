name: build

on:
  push:
    branches: [main]
    # One repository, one app per Kubuno module: the tag prefix says which app
    # is being released (drive-v1.2.0, mail-v0.1.0).
    tags: ["*-v*"]
  pull_request:

# The Android project lives in android/ (iOS will sit beside it in ios/).
defaults:
  run:
    working-directory: android

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew test

      - name: Assemble every app
        run: ./gradlew assembleDebug

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: kubuno-android-debug
          path: android/app-*/build/outputs/apk/debug/*.apk

  release:
    if: contains(github.ref, '-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # drive-v0.2.0 -> app-drive
      - name: Resolve the app from the tag
        id: app
        run: echo "module=app-${GITHUB_REF_NAME%%-v*}" >> "$GITHUB_OUTPUT"

      - name: Assemble release APK (unsigned)
        run: ./gradlew :${{ steps.app.outputs.module }}:assembleRelease

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: android/${{ steps.app.outputs.module }}/build/outputs/apk/release/*.apk
          generate_release_notes: true
